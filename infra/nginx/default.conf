# Exact loopback authorities/origins; reject DNS rebinding and cross-origin access.
map $http_host $allowed_host {
    default 0;
    "localhost:8080" 1;
    "127.0.0.1:8080" 1;
}
map $http_origin $allowed_origin {
    default 0;
    "" 1;
    "http://localhost:8080" 1;
    "http://127.0.0.1:8080" 1;
}
server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1;
    server_tokens off;
    access_log off;
    client_max_body_size 4k;
    default_type application/json;
    if ($allowed_host = 0) { return 403 '{"schema_version":1,"error":{"code":"access_denied","message":"Access denied.","details":[]}}'; }
    if ($allowed_origin = 0) { return 403 '{"schema_version":1,"error":{"code":"access_denied","message":"Access denied.","details":[]}}'; }
    location = /healthz { return 200 '{"status":"ok","service":"nginx"}'; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $http_host;
    }
}
